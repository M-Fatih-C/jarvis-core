name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run test suite
        run: |
          source .venv/bin/activate
          pytest -v

  firebase-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Java 21 (for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run Strict Firebase Emulator Acceptance Suite
        run: |
          firebase --config cloud/firebase.json emulators:exec \
            --only firestore \
            --project jarvis-core-dev \
            ".venv/bin/python scripts/firebase_emulator_test.py --require-emulator"

  swift-macos-agent:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build JarvisMacAgent & Run Swift Unit Tests
        run: |
          cd macos/JarvisMacAgent
          swift test -v
          swift build -c release

  swift-ios-app:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run iOS Swift Unit Tests (Auth, Decoding, Lifecycle, Approval)
        run: |
          cd ios/JarvisiOSTests
          swift test -v

      - name: Build Jarvis iOS App (Generic Destination, Unsigned CI)
        run: |
          xcodebuild -project ios/JarvisiOS/JarvisiOS.xcodeproj \
            -scheme JarvisiOS \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
